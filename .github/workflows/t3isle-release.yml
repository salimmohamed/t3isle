name: T3 Isle release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t3isle-release.yml
      - Configuration/dmg/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3isle-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_NAME: T3 Isle
  DMG_NAME: T3-Isle.dmg

jobs:
  build:
    name: Build DMG
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Homebrew tap token
        if: github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Release tags need the HOMEBREW_TAP_TOKEN secret to update the Homebrew tap"
            exit 1
          fi

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ${VERSION:+"MARKETING_VERSION=$VERSION"}

      - name: Sign app
        env:
          RELEASE_CERT_P12: ${{ secrets.T3ISLE_RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.T3ISLE_RELEASE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_CERT_P12" || -z "$RELEASE_CERT_PASSWORD" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::Release tags need the T3ISLE_RELEASE_CERT_P12 and T3ISLE_RELEASE_CERT_PASSWORD secrets"
              exit 1
            fi
            echo "::warning::Release signing secrets are not available, so this build stays ad-hoc signed"
            exit 0
          fi
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          CERT="$RUNNER_TEMP/release-signing.p12"
          remove_signing_material() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$CERT"
          }
          trap remove_signing_material EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$RELEASE_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '$1 == "1)" { print $2; exit }')"
          if [[ ! "$IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::No code signing identity found in the release certificate"
            exit 1
          fi
          REQUIREMENT="designated => certificate leaf = H\"$IDENTITY\""
          codesign --force --deep --preserve-metadata=entitlements,flags,runtime \
            --keychain "$KEYCHAIN" -s "$IDENTITY" -r="$REQUIREMENT" "$APP"
          SIGNED_REQUIREMENT="$(codesign -d -r- "$APP")"
          echo "$SIGNED_REQUIREMENT"
          grep -qiF "$REQUIREMENT" <<<"$SIGNED_REQUIREMENT"

      - name: Check app is not sandboxed
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          ENTITLEMENTS="$(codesign -d --entitlements - --xml "$APP" | tr -d '[:space:]')"
          if grep -qF '<key>com.apple.security.app-sandbox</key><true/>' <<<"$ENTITLEMENTS"; then
            echo "::error::$APP_NAME.app is signed with com.apple.security.app-sandbox, so it cannot read ~/.t3"
            exit 1
          fi

      - name: Check app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"
          ENTITLEMENTS="$(codesign -d --entitlements - --xml "$APP")"
          if grep -q get-task-allow <<<"$ENTITLEMENTS"; then
            echo "::error::$APP_NAME.app is signed with get-task-allow"
            exit 1
          fi
          "$APP/Contents/MacOS/$APP_NAME" > "$RUNNER_TEMP/launch.log" 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID"; then
            cat "$RUNNER_TEMP/launch.log"
            echo "::error::$APP_NAME.app exited during launch"
            exit 1
          fi
          pkill -9 -P "$APP_PID" || true
          kill -9 "$APP_PID"

      - name: Create DMG
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          mkdir -p dist
          ./Configuration/dmg/create_dmg.sh \
            "$DERIVED_DATA/Build/Products/Release/$APP_NAME.app" \
            "dist/$DMG_NAME" \
            "$APP_NAME"
          shasum -a 256 "dist/$DMG_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.DMG_NAME }}
          path: dist/${{ env.DMG_NAME }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ env.DMG_NAME }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **Install**

          Install with Homebrew. The cask clears the download flag, so T3 Isle opens on the first try:

          ```sh
          brew install --cask salimmohamed/tap/t3-isle
          ```

          Or install the DMG by hand:

          1. Download `T3-Isle.dmg`, open it, and drag **T3 Isle** onto **Applications**.
          2. Open T3 Isle. This build is not notarized, so macOS says “T3 Isle.app” Not Opened. Click **Done**.
          3. Open **System Settings → Privacy & Security**, scroll to Security, and click **Open Anyway** next to “T3 Isle.app” was blocked to protect your Mac. Confirm with your password.

          Or skip steps 2 and 3 by clearing the download flag in Terminal: `xattr -dr com.apple.quarantine "/Applications/T3 Isle.app"`
          NOTES
          gh release create "$GITHUB_REF_NAME" "dist/$DMG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "T3 Isle $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes

  tap:
    name: Update Homebrew tap
    needs: [build, release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ env.DMG_NAME }}
          path: dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: salimmohamed/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          SHA256="$(sha256sum "dist/$DMG_NAME" | cut -d' ' -f1)"
          CASK=tap/Casks/t3-isle.rb
          sed -i -E "s/^  version \".*\"$/  version \"$VERSION\"/; s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" "$CASK"
          grep -qxF "  version \"$VERSION\"" "$CASK"
          grep -qxF "  sha256 \"$SHA256\"" "$CASK"
          cd tap
          if git diff --quiet; then
            echo "::notice::The tap already has t3-isle $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "t3-isle $VERSION"
          git push

---
name: Bug Report
description: File a bug report.
title: '[Bug] '
type: Bug
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? What are the steps to reproduce the issue?
      description: >-
        Describe the bug and include the steps to replicate the issue. Issues
        with images or videos will be resolved faster.
      placeholder: Clearly explain the issue. Please limit each post to one issue.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: T3 Isle Version
      description: >-
        What version of T3 Isle are you running? (Click the T3 Isle icon in the
        menu bar > Settings > About > Version.)
      placeholder: "v0.1.1"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS Version
      description: Go to  > About This Mac
    validations:
      required: true
  - type: dropdown
    id: music-source
    attributes:
      label: Music Source? (If relevant)
      description: >-
        If this issue is related to music, what music source did you select in
        T3 Isle settings?
      options:
        - Now Playing
        - Apple Music
        - Spotify
        - YouTube Music
    validations:
      required: false
  - type: input
    id: music-app
    attributes:
      label: Music App (If using Now Playing)
    validations:
      required: false
  - type: input
    id: music-website
    attributes:
      label: Website (If using browser for music)
    validations:
      required: false
  - type: textarea
    id: t3-code
    attributes:
      label: T3 Code version and connection state (If relevant)
      description: >-
        If this issue is related to T3 Code, give the T3 Code version and the
        connection state the notch shows (Live, Connecting…, or the error
        text).
      placeholder: "T3 Code v0.0.1, notch shows Live"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Please copy and paste any relevant log output. This will be
        automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description: 
      options:
        - label: I haven't found any duplicates with my issue.
          required: true
